name: Update latest posts

on:
  schedule:
    # 매일 오전 9시 17분(KST)에 실행합니다.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update latest posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # v1.9.7
        with:
          feed_list: "https://nninyeong.tistory.com/rss"
          accept_header: "*/*"
          max_post_count: 3
          template: "- [$title]($url) — $date$newline"
          date_format: "yyyy.mm.dd"
          tag_post_pre_newline: true
          enable_keepalive: false
          commit_message: "chore: update latest posts"
